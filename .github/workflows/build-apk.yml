name: Compilar APK Minimal Messenger

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew || true

      - name: Verificar configuración AndroidX
        run: |
          pwd
          ls -la
          find . -name gradle.properties -print
          cat gradle.properties
          grep -n "android.useAndroidX" gradle.properties

      - name: Compilar APK de Android (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
      - name: Publicar archivo APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: minimal-messenger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
