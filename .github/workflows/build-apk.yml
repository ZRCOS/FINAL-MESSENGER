```yaml
name: Compilar APK Minimal Messenger

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Diagnóstico del entorno
        run: |
          echo "=== DIRECTORIO ACTUAL ==="
          pwd
          echo "=== ARCHIVOS DE LA RAÍZ ==="
          ls -la
          echo "=== VERSIONES ==="
          java -version
          ./gradlew --version

      - name: Revisar configuración AndroidX
        run: |
          echo "=== ARCHIVOS gradle.properties ==="
          find . -name gradle.properties -print
          if [ -f gradle.properties ]; then
            cat gradle.properties
          else
            echo "No existe gradle.properties en la raíz."
          fi

      - name: Compilar APK de Android (Debug)
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee build-log.txt

      - name: Mostrar resumen si falla la compilación
        if: steps.compile.outcome == 'failure'
        run: |
          echo "=== ÚLTIMAS 100 LÍNEAS DEL REGISTRO ==="
          tail -n 100 build-log.txt
          echo "=== INFORMES DE GRADLE ==="
          find . -path '*/build/reports/*' -type f -print

      - name: Subir registros de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacion
          path: |
            build-log.txt
            **/build/reports/**
          if-no-files-found: ignore

      - name: Detener el flujo si falló la compilación
        if: steps.compile.outcome == 'failure'
        run: |
          echo "La compilación de Gradle falló. Revisa el artefacto diagnostico-compilacion."
          exit 1

      - name: Publicar archivo APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: minimal-messenger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```