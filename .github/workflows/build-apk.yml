```yaml
name: Compilar APK Minimal Messenger

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Diagnostico del entorno
        run: |
          pwd
          ls -la
          java -version
          ./gradlew --version

      - name: Revisar gradle.properties
        run: |
          find . -name gradle.properties -print
          if [ -f gradle.properties ]; then
            cat gradle.properties
          else
            echo "No existe gradle.properties en la raiz."
          fi

      - name: Compilar APK
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-log.txt

      - name: Mostrar error de compilacion
        if: steps.compile.outcome == 'failure'
        run: |
          tail -n 100 build-log.txt
          find . -path '*/build/reports/*' -type f -print

      - name: Subir registros de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacion
          path: |
            build-log.txt
            **/build/reports/**
          if-no-files-found: ignore

      - name: Fallar si Gradle no compilo
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-messenger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
